name: Pick iOS Simulator
description: >
  Boots the newest available iPhone simulator and exports its udid as SIM_ID.
  Extracted into an action because every job that runs xcodebuild needs it — the sibling
  purse-ios-securefields repo copy-pastes this block between jobs instead.

runs:
  using: composite
  steps:
    - name: Pick iOS Simulator
      shell: bash
      run: |
        SIM_ID=$(xcrun simctl list -j devices available | python3 -c "
        import json, sys
        d = json.load(sys.stdin)['devices']
        for rt, devs in sorted(d.items(), reverse=True):
            if 'iOS' not in rt: continue
            for dev in devs:
                if 'iPhone' in dev['name']:
                    print(dev['udid'])
                    raise SystemExit
        ")
        if [ -z "$SIM_ID" ]; then
          echo "::error::No iPhone simulator available on this runner"
          exit 1
        fi
        echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
        xcrun simctl boot "$SIM_ID" || true
