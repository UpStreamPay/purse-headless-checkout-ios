version: 2

# GitHub Actions only. The Swift packages are updated by .github/workflows/swift-package-update.yml:
# Dependabot's Swift job could never resolve Package.swift, because its proxy refuses the host
# Klarna's binary targets download from (see docs/contributing/ci.md).
updates:
  # Keeps the SHA pins in .github/workflows/ current: Dependabot rewrites both the SHA and its
  # trailing version comment. The `ci` prefix keeps these bumps out of the changelog. Security
  # updates get their own group, opened as soon as an advisory lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
