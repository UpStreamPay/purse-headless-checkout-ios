version: 2

# One grouped pull request a week per ecosystem: Swift packages in one, GitHub Actions in another,
# so a platform bump and a CI bump are reviewed (and pass the required checks) separately. Security
# updates open their own pull request as soon as an advisory lands, also grouped per ecosystem.
updates:
  # Package.swift's dependencies (Secure Fields, PayPal, Klarna). A vendor SDK bump lands as a PR,
  # so CI's library tests and both Demo configurations vet it before merge. Klarna cannot be
  # resolved by Dependabot (its CDN answers 403, see docs/contributing/ci.md).
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      swift-dependencies:
        patterns:
          - "*"
      swift-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Keeps the SHA pins in .github/workflows/ current: Dependabot rewrites both the SHA and its
  # trailing version comment. The `ci` prefix keeps these bumps out of the changelog.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
