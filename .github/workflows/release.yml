name: Release

# Same shape as purse-securefields-ios: on every published release, build signed XCFrameworks,
# rewrite Package.swift to binary targets, retag, attach the zips. PurseCheckoutPayPal stays a
# source target (see scripts/binary-manifest.py).
on:
  release:
    types: [published]

permissions:
  contents: write

# Two tags per version. release-please creates `sdk-vX.Y.Z` on the release commit on main and never
# moves it — that is how it finds the previous release. This workflow then creates `vX.Y.Z` on the
# binary-targets commit (Package.swift pointing at the signed zips), the only tag SPM sees. TAG (the
# release's) is read by every step through the environment, never interpolated into a script: a tag
# name is text anyone with write access chooses.
env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  xcframework:
    name: Build & publish XCFrameworks
    # Older than CI's macos-26 on purpose: the .swiftinterface is written by this Xcode, and an
    # older one keeps the binaries importable by merchants who have not upgraded yet.
    runs-on: macos-15
    timeout-minutes: 60
    # Every release waits for a codeowner: the `release` environment requires a review from
    # @UpStreamPay/pci-dss and holds the signing secrets and the release token.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0   # the tag check below needs main's history

      # Only code that went through a reviewed PR ships.
      - name: Refuse a tag that is not on main
        run: |
          git merge-base --is-ancestor "$TAG" origin/main \
            || { echo "::error::$TAG is not on main — only reviewed code is released."; exit 1; }

      # The release tag must be release-please's own `sdk-vX.Y.Z`; VERSION (`vX.Y.Z`) is the SPM tag
      # this run creates. Anything else — an old-style `vX.Y.Z` release, a typo — stops here.
      - name: Read the version from the release tag
        run: |
          [[ "$TAG" =~ ^sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$TAG is not a release-please tag (sdk-vX.Y.Z)."; exit 1; }
          echo "VERSION=${TAG#sdk-}" >> "$GITHUB_ENV"

      # The v1.1.0 run died inside the certificate import on "At least one of p12-filepath or
      # p12-file-base64 must be provided". Say what is missing instead.
      - name: Check the release secrets
        env:
          P12: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_P12_PASSWORD }}
          RELEASE_TOKEN: ${{ secrets.TF_REPO_AUTOMATION_PAT }}
        run: |
          missing=""
          [ -n "$RELEASE_TOKEN" ] || missing="$missing TF_REPO_AUTOMATION_PAT"
          [ -n "$P12" ] || missing="$missing APPLE_SIGNING_CERT_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing APPLE_SIGNING_CERT_P12_PASSWORD"
          [ -z "$missing" ] || { echo "::error::Missing secrets:$missing — see docs/contributing/release.md."; exit 1; }

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_SIGNING_CERT_P12_PASSWORD }}

      - name: Build XCFrameworks
        run: ./scripts/build-xcframeworks.sh

      - name: Verify XCFrameworks before publishing
        run: |
          set -eu
          for module in PurseHeadlessCheckout PurseCheckoutApplePay PurseCheckoutKlarna; do
            for slice in "xcframeworks/$module.xcframework"/ios-*; do
              fw="$slice/$module.framework"
              ls "$fw/Modules/$module.swiftmodule/"*.swiftinterface > /dev/null \
                || { echo "::error::$slice has no .swiftinterface — consumers cannot import $module."; exit 1; }
              if [ "$module" != PurseHeadlessCheckout ]; then
                # A plugin must link the core framework, never carry its own copy of it.
                otool -L "$fw/$module" | grep -q "@rpath/PurseHeadlessCheckout.framework" \
                  || { echo "::error::$module does not link PurseHeadlessCheckout.framework."; exit 1; }
              fi
            done
          done
          test -f xcframeworks/PurseHeadlessCheckout.xcframework/ios-arm64/PurseHeadlessCheckout.framework/PrivacyInfo.xcprivacy \
            || { echo "::error::PrivacyInfo.xcprivacy missing from the framework root."; exit 1; }
          # The published layout — binaries plus the PayPal source plugin — must compile and link
          # for a consumer, exactly as a merchant's build would.
          python3 scripts/binary-manifest.py path xcframeworks PurseHeadlessCheckout PurseCheckoutApplePay PurseCheckoutKlarna
          sed -i '' 's/, type: .dynamic, targets: \["PurseCheckoutPayPal"\]/, targets: ["PurseCheckoutPayPal"]/' Package.swift
          mv Sources/PurseHeadlessCheckout Sources/PurseCheckoutApplePay Sources/PurseCheckoutKlarna "$RUNNER_TEMP/"
          xcodebuild build -quiet -scheme PurseCheckoutPayPal -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
          mv "$RUNNER_TEMP/PurseHeadlessCheckout" "$RUNNER_TEMP/PurseCheckoutApplePay" "$RUNNER_TEMP/PurseCheckoutKlarna" Sources/
          git checkout Package.swift
          rm -rf Sources/*Deps

      - name: Sign, zip, checksum
        run: |
          set -eu
          # A *valid* identity only: an expired or untrusted one would still sign, and ship a
          # signature no consumer can trust.
          IDENTITY=$(security find-identity -v -p codesigning | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "::error::No valid codesigning identity. Either the certificate is expired or its chain is untrusted, or the .p12 holds only the certificate without its private key — re-export BOTH, then regenerate APPLE_SIGNING_CERT_P12_BASE64."; exit 1; }
          SPECS=""
          for module in PurseHeadlessCheckout PurseCheckoutApplePay PurseCheckoutKlarna; do
            codesign --timestamp -v --sign "$IDENTITY" "xcframeworks/$module.xcframework"
            (cd xcframeworks && zip -qr "$module.xcframework.zip" "$module.xcframework")
            SPECS="$SPECS $module=$(swift package compute-checksum "xcframeworks/$module.xcframework.zip")"
          done
          echo "SPECS=$SPECS" >> "$GITHUB_ENV"

      - name: Rewrite Package.swift to binary targets
        run: |
          # shellcheck disable=SC2086
          python3 scripts/binary-manifest.py url \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" $SPECS

      # The `release tags` ruleset lets only repository admins create a v* tag, so the push goes out
      # as TF_REPO_AUTOMATION_PAT (an admin's token, readable only inside this approved job) and not as
      # GITHUB_TOKEN: bypassing the GitHub Actions app instead would let any workflow on any branch
      # write a tag. The token is used for this one command only, never handed to checkout, so it is
      # not in .git/config while third-party package code builds. The SPM tag is created, never
      # moved: no --force, so a re-run that finds it already there fails instead of rewriting it.
      - name: Commit & tag for SPM
        env:
          RELEASE_TOKEN: ${{ secrets.TF_REPO_AUTOMATION_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift Sources/*Deps
          git commit -m "release: ${VERSION} — binary targets"
          git tag "${VERSION}"
          # The empty extraheader drops checkout's GITHUB_TOKEN header, so the URL's token is used.
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${VERSION}"

      - name: Upload XCFrameworks to release
        run: gh release upload "$TAG" xcframeworks/*.xcframework.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
