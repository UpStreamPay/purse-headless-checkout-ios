name: Release Please

# Conventional commits on main decide the next semantic version. Running this workflow by hand
# freezes a release: release-please opens the release PR with the changelog, which builds the
# upcoming release for NRT (upcoming-release.yml). While it is open only fixes reach main
# (release-freeze.yml) and each one updates it. Merging it (reviewed and gated like any other PR)
# creates the `sdk-v<version>` tag and the GitHub release, and publishing that release triggers
# release.yml. Nothing is pushed to main directly. See docs/contributing/release.md.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  # Documented by the action as required. A token passed as an input is not scoped by this block,
  # so a missing entry here stays invisible until the token changes.
  issues: write
  pull-requests: write

jobs:
  release-please:
    # A dispatch from another branch would release from it.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The token lives only in this environment (deployable from main alone) and in `release`, never
    # as a repository secret: a workflow pushed on any other branch could read a repository secret,
    # and this one is an admin's, which bypasses the `release tags` ruleset.
    environment: release-please
    steps:
      # On push, update the release PR only during a freeze; otherwise just tag a merged one.
      - name: Release PR open?
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh pr list --state open --label 'autorelease: pending' --json number -q length)
          echo "open=$n" >> "$GITHUB_OUTPUT"

      # TF_REPO_AUTOMATION_PAT is a fine-grained token scoped to this repository alone (Contents,
      # Pull requests and Issues: read and write). It is not GITHUB_TOKEN because events raised by
      # GITHUB_TOKEN start no workflow: CI must run on the release PR, and the published release
      # must trigger release.yml. It replaces the org-wide admin PAT used before.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.TF_REPO_AUTOMATION_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: ${{ github.event_name == 'push' && steps.freeze.outputs.open == '0' }}
