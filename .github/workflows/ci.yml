name: CI

on:
  pull_request:
  # The merged result is what release-please tags; test it, not only the PR head.
  push:
    branches: [main]

# Read-only is all the build needs. It also keeps a write-scoped GITHUB_TOKEN away from pull
# requests, whatever the repository default is.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-tests:
    name: Library Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ios-simulator

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PurseHeadlessCheckout \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | grep --line-buffered -E "(Test Suite|Test Case|✔|✘|error:|FAILED|PASSED|run with)"

  demo-app:
    name: Demo App
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A build only needs the destination to exist: no boot (about 2 minutes, billed at the macOS rate).
      - uses: ./.github/actions/ios-simulator
        with:
          boot: 'false'

      # Both configurations. Release is the one that matters: the Demo once referred to a
      # `#if DEBUG` type unconditionally, so it did not compile in Release at all — and nothing
      # built that configuration, so nobody found out. SDK-12264 asks for a release build taking a
      # sandbox payment, which starts with the release build existing.
      - name: Build (Debug and Release)
        run: |
          set -o pipefail
          for configuration in Debug Release; do
            xcodebuild build \
              -project Demo/Demo.xcodeproj \
              -scheme Demo \
              -configuration "$configuration" \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              CODE_SIGNING_ALLOWED=NO \
              | grep --line-buffered -E "(error:|warning:|BUILD)"
          done

  release-build:
    name: Release build (macos-15)
    # What release.yml builds, on the toolchain it builds with (macos-15, an older Xcode on purpose),
    # unsigned. That compiler is not the one the jobs above use: v1.2.0 failed to release on a Swift
    # 6.1 concurrency error that Xcode 26 accepts, and nothing had built with Xcode 16 before.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build XCFrameworks
        run: ./scripts/build-xcframeworks.sh
