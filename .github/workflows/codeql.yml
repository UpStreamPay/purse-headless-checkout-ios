name: CodeQL

# Advanced setup, not GitHub's default one: default setup builds Swift with autobuild, which runs
# `swift build` on a macOS host, and this package is iOS-only, so that build fails (see AGENTS.md).
# The Swift job builds every product's own scheme for the simulator instead. The repository must
# have code scanning enabled with default setup *off*: GitHub rejects advanced-setup uploads while
# default setup is on. See docs/contributing/ci.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read            # on a private repository, the action reads its own workflow run
      contents: read
      security-events: write   # upload the results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          # scripts/*.py, which build the release manifests. Default setup scans it today, so the
          # switch to this workflow must not drop it.
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-26
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Each product through its own scheme: an unbuilt target in a multi-product package does not
      # fail the umbrella build, and an unbuilt target is an unscanned one.
      - name: Build every product
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          for scheme in PurseHeadlessCheckout PurseCheckoutApplePay PurseCheckoutPayPal PurseCheckoutKlarna; do
            xcodebuild build \
              -scheme "$scheme" \
              -destination "generic/platform=iOS Simulator" \
              CODE_SIGNING_ALLOWED=NO \
              | grep --line-buffered -E "(error:|BUILD)"
          done

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
